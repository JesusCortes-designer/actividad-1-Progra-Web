<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de alumnos</title>
    <link rel="stylesheet" href="css/formato.css">
</head>
<body>
<form class="formulario">
            <!-- Pedir al usuario que ingrese los datos -->
            <div class="pregunta">
                <label>Ingrese el nombre del estudiante</label>
                <input type="text" id="nombre" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '')" placeholder="Ej: Juan" required>            </div>

             <div class="pregunta">
                <label>Ingrese la calificacion del alumno</label>
                <input type="number" id="calificacion" placeholder="1-10" required min="1.0" max="10" step="0.1">
            </div>

            <div class="pregunta">
                <label>Resultados</label>
                <input id="PromedioTotal" placeholder="Promedio de calificaciones" readonly>
                <input id="calificacionAlta" placeholder="Alumno con la calificación mas alta"  readonly>
                <input id="calificacionBaja" placeholder="Alumno con la calificación mas baja"  readonly>
            </div>
            <!-- Botón -->
            <button onclick="añadirEstudiante()" type="button">Añadir estudiante</button>
            <button onclick="hacerCalculos()" type="button">Hacer Calculos</button>
        </form>
            <script src="js/ejercicio15.js"></script>

</body>
</html>
