<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulación del DOM</title>

    <!-- Se incluye Bootstrap desde un CDN (servidor externo), esto carga
         todas las clases predefinidas de estilo sin necesitar un CSS propio -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- "container" centra el contenido y lo hace responsivo automáticamente;
         "py-5" agrega espacio arriba y abajo (padding vertical) -->
    <div class="container py-5" style="max-width: 500px;">

        <h1 class="text-center mb-4">Agregar y Eliminar Elementos</h1>

        <!-- "input-group" junta visualmente el input y el botón como si fueran
             una sola pieza, en vez de verse separados -->
        <div class="input-group mb-4">
            <!-- id="nuevoElemento" es lo que el JS usa para encontrar este input
                 con document.getElementById() -->
            <input type="text" id="nuevoElemento" class="form-control" placeholder="Escribe algo">

            <!-- id="agregarBtn" es lo que el JS usa para "escuchar" los clics
                 con addEventListener() -->
            <button id="agregarBtn" class="btn btn-primary">Agregar</button>
        </div>

        <!-- Este <ul> empieza VACÍO a propósito: el JS le va a ir agregando
             elementos <li> dinámicamente cada vez que el usuario presione "Agregar" -->
        <ul id="lista" class="list-group"></ul>

        <p class="text-center mt-4">
            <a href="index.html">Regresar al index</a>
        </p>

    </div>

    <!-- El script va al FINAL del body a propósito: así el navegador ya
         terminó de crear todos los elementos de arriba (input, botón, ul)
         ANTES de que el JS intente buscarlos con getElementById -->
    <script src="app.js"></script>
</body>
</html>
