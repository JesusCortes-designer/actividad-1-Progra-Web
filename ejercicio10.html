<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de grados</title>
    <link rel="stylesheet" href="css/formato.css">
</head>
<body>
    <h1>Calculadora para convertir de grados Celcius a Fharenheit</h1>
    <div class="contenedor-formulario">
        <form class="formulario">
            <!-- Pedir al usuario que ingrese los datos -->
            <div class="pregunta">
                <label for="celsius">Introdusca los grados Celcius</label>
                <input type="text" id="celsius" oninput="this.value = this.value.replace(/[^0-9.-]/g, '')" placeholder="Ej: 20" required>
            </div>

            <div class="pregunta">
                <label for="mensaje">Grados en Fharenheit</label>
                <input id="mensaje" placeholder="Aquí se mostraran los grados en Fharenheit" readonly>
            </div>
            <!-- Botón -->
            <button  onclick="convertir()"type="button">Calcular grados</button>
        </form>
    </div>

    <p><a href="index.html">Regresar al index</a></p>

    <script src="js/ejercicio10.js"></script>
</body>
</html>
