<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de pesos a dolares</title>
    <link rel="stylesheet" href="css/formato.css">
</head>
<body>
    <h1>Calculadora para convertir de pesos mexicanos a dolares estadounidenses
    </h1>
    <div class="contenedor-formulario">
        <form class="formulario">
            <!-- Pedir al usuario que ingrese los datos -->
            <div class="pregunta">
                <label for="pesos">Introdusca la cantidad en pesos mexicanos</label>
                <input type="text" id="pesos" oninput="this.value = this.value.replace(/[^0-9.-]/g, '')" placeholder="Ej: 20" required>
            </div>

            <div class="pregunta">
                <label for="mensaje">Equivalente en dolares</label>
                <input id="mensaje" placeholder="Aquí se mostrara el equivalente en dolares" readonly>
            </div>
            <!-- Botón -->
            <button onclick="convertir()" type="button">Calcular dolares</button>
        </form>
    </div>

    <p><a href="index.html">Regresar al index</a></p>

    <script src="js/ejercicio12.js"></script>
</body>
</html>
